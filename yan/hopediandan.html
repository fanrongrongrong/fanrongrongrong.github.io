<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hope 点单</title>
<style>
  :root{
    --bg:#fbf4f7; --card:#ffffff; --pink:#f7c8db; --pink-deep:#e88db1;
    --pink-line:#f0d5e0; --ink:#5c4650; --ink-soft:#a08792;
    --accent:#d9578a; --shadow:0 2px 14px rgba(216,120,160,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); padding:20px 14px 150px;
    font-size:15px; line-height:1.5;
  }
  .wrap{max-width:480px; margin:0 auto;}
  header{margin-bottom:16px; padding:0 4px;}
  header h1{font-size:21px; font-weight:700; letter-spacing:.5px; color:var(--accent);}
  header p{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .note{
    background:#fff5fa; border:1px dashed var(--pink-deep); border-radius:12px;
    padding:8px 12px; margin:10px 4px 0; font-size:12px; color:#b04d7e;
  }
  .card{
    background:var(--card); border:1px solid var(--pink-line);
    border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .label{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:9px; letter-spacing:.5px;}
  .row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 14px; border-radius:12px; cursor:pointer;
    background:var(--bg); border:1.5px solid transparent;
    font-size:14px; font-weight:500; color:var(--ink); transition:.14s; user-select:none;
  }
  .chip:active{transform:scale(.97);}
  .chip.on{background:var(--pink); border-color:var(--pink-deep); color:#9c3565; font-weight:600;}
  .chip .p{font-size:12px; color:var(--ink-soft); margin-left:5px;}
  .chip.on .p{color:#b04d7e;}
  .chip.dim{opacity:.35; cursor:default;}
  .znote{width:100%; font-size:12px; color:#b04d7e; margin-top:2px;}
  .qtybar{display:flex; align-items:center; gap:14px;}
  .qtybar button{
    width:40px; height:40px; border-radius:11px; border:1.5px solid var(--pink-line);
    background:#fff; color:var(--accent); font-size:22px; font-weight:600; cursor:pointer;
  }
  .qtybar button:active{background:var(--pink);}
  .qtybar input{
    width:64px; height:40px; text-align:center; font-size:19px; font-weight:700;
    border:1.5px solid var(--pink-line); border-radius:11px; color:var(--accent); background:#fff;
  }
  .qtybar .u{font-size:12.5px; color:var(--ink-soft);}
  .addbtn{
    width:100%; margin-top:2px; padding:14px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600;
    cursor:pointer; box-shadow:0 3px 10px rgba(217,87,138,.3); transition:.14s;
  }
  .addbtn:active{transform:translateY(1px);}
  .addbtn:disabled{background:#e9c3d3; box-shadow:none; cursor:default;}
  .order-title{font-size:13px; font-weight:700; color:var(--ink); margin:22px 4px 10px;}
  .item{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--pink-line); border-radius:14px;
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow);
  }
  .item .info{flex:1; min-width:0;}
  .item .info .name{font-size:14px; font-weight:600; color:var(--ink);}
  .item .info .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .item .money{font-size:15px; font-weight:700; color:var(--accent); margin:0 12px; white-space:nowrap;}
  .item .del{
    width:28px; height:28px; border-radius:8px; border:none; background:var(--bg);
    color:var(--ink-soft); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .item .del:active{background:var(--pink);}
  .empty-order{text-align:center; color:var(--ink-soft); font-size:13px; padding:18px 0;}
  .footer{
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
    border-top:1px solid var(--pink-line); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .footer .inner{max-width:480px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .footer .sum .l{font-size:12px; color:var(--ink-soft);}
  .footer .sum .n{font-size:24px; font-weight:800; color:var(--accent);}
  .footer .sum .n small{font-size:13px;}
  .footer .btns{display:flex; gap:8px;}
  .footer .clear{
    padding:11px 14px; border-radius:12px; border:1.5px solid var(--pink-line);
    background:#fff; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
  }
  .footer .clear:active{background:var(--pink);}
  .footer .pay{
    padding:11px 20px; border-radius:12px; border:none;
    background:var(--accent); color:#fff; font-size:14px; font-weight:700; cursor:pointer;
    box-shadow:0 3px 10px rgba(217,87,138,.3);
  }
  .footer .pay:active{transform:translateY(1px);}
  .footer .pay:disabled{background:#e9c3d3; box-shadow:none;}
  .mask{
    position:fixed; inset:0; background:rgba(60,40,52,.55); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:99;
  }
  .mask.show{display:flex;}
  .modal{
    background:#fff; border-radius:22px; padding:20px 18px 18px; width:100%; max-width:340px;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.25); max-height:92vh; overflow-y:auto;
  }
  .modal .mt{font-size:13px; color:var(--ink-soft);}
  .modal .mn{font-size:34px; font-weight:800; color:var(--accent); margin:2px 0 12px;}
  .modal .mn small{font-size:16px;}
  .modal .list{
    text-align:left; background:var(--bg); border-radius:12px; padding:10px 12px;
    margin-bottom:14px; font-size:12px; color:var(--ink-soft); line-height:1.8;
  }
  .modal img{width:100%; border-radius:14px; display:block;}
  .qrwrap{margin-bottom:10px;}
  .qrtab{display:flex; gap:8px; margin-bottom:10px; justify-content:center;}
  .qrtab button{
    flex:1; padding:9px; border-radius:11px; border:1.5px solid var(--pink-line);
    background:#fff; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
  }
  .qrtab button.on{background:var(--pink); border-color:var(--pink-deep); color:#9c3565;}
  .modal .tip{font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.6;}
  .modal .close{
    width:100%; margin-top:14px; padding:12px; border:none; border-radius:12px;
    background:var(--bg); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer;
  }
  .modal .close:active{background:var(--pink);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>hope 点单</h1>
    <p>选区 · 选模式 · 选方式 · 加入订单</p>
    <div class="note">默认不卡男女 · 皮肤 · 声音　|　以下均为一陪一价格，多陪叠加请找高管</div>
  </header>

  <div class="card">
    <div class="label">大区</div>
    <div class="row" id="zoneRow"></div>
  </div>

  <div class="card">
    <div class="label">模式</div>
    <div class="row" id="modeRow"><span class="empty-order" style="padding:4px">先选区</span></div>
  </div>

  <div class="card">
    <div class="label">计费方式</div>
    <div class="row" id="billRow"><span class="empty-order" style="padding:4px">先选模式</span></div>
  </div>

  <div class="card">
    <div class="label">数量</div>
    <div class="qtybar">
      <button onclick="step(-1)">−</button>
      <input id="qty" type="number" value="1" min="1" onchange="clampQty()">
      <button onclick="step(1)">＋</button>
      <span class="u" id="unit"></span>
    </div>
  </div>

  <button class="addbtn" id="addBtn" onclick="addItem()" disabled>加入订单</button>

  <div class="order-title">当前订单</div>
  <div id="orderList"><div class="empty-order">还没有点单</div></div>
</div>

<div class="footer">
  <div class="inner">
    <div class="sum">
      <div class="l">合计</div>
      <div class="n" id="grandTotal">0<small> 元</small></div>
    </div>
    <div class="btns">
      <button class="clear" onclick="clearAll()">清空</button>
      <button class="pay" id="payBtn" onclick="openPay()" disabled>去付款</button>
    </div>
  </div>
</div>

<div class="mask" id="mask" onclick="maskClick(event)">
  <div class="modal">
    <div class="mt">应付金额</div>
    <div class="mn" id="payNum">0<small> 元</small></div>
    <div class="list" id="payList"></div>
    <div class="qrtab">
      <button id="tabMain" class="on" onclick="switchQR(1)">主收款码</button>
      <button id="tabBackup" onclick="switchQR(2)">备用码</button>

// 每个区固定三个模式：技术·开麦 / 技术·无麦 / 娱乐（娱乐默认开麦）。
// 写一个数字 = 1h价，半h自动按 1h/2；写 {half,hour} = 两个价都指定；null = 价格待定（按钮变灰）；不写 = 这个区没有该模式（不显示）。
var MODES=[["tm","技术·开麦"],["tn","技术·无麦"],["fun","娱乐"]];
var DATA={
  "寻宝区":{tm:30,tn:25,fun:23},
  "惊魂夜区":{tm:33.3,tn:28.8,fun:26},
  "巅峰区":{tm:35,tn:30,fun:26.6},
  "超燃区":{tm:36.6,tn:28.8,fun:26},
  "擂台区":{tm:{half:13,hour:22.9},tn:{half:11,hour:18.8},fun:{half:8.9,hour:17},
           note:"擂台不接一局，只接时间单"},
  "揪出区":{tm:34,fun:30,note:"揪出默认开麦"},
  "乐园区":{note:"乐园现只接擂台，请选擂台区下单"},
  "捣蛋鬼区":{tm:{half:12,hour:24},tn:{half:10,hour:20},fun:null}
};
var BILLS=[["half","半h","个半小时"],["hour","1h","小时"]];

var sel={zone:null,modeIdx:null,bill:null};
var order=[];

var zoneRow=document.getElementById("zoneRow");
var modeRow=document.getElementById("modeRow");
var billRow=document.getElementById("billRow");

Object.keys(DATA).forEach(function(z){
  var c=document.createElement("div");
  c.className="chip"; c.textContent=z;
  c.onclick=function(){sel={zone:z,modeIdx:null,bill:null}; drawZone(); drawMode(); drawBill(); syncBtn();};
  zoneRow.appendChild(c);
});
function drawZone(){[].forEach.call(zoneRow.children,function(c){c.classList.toggle("on",c.textContent===sel.zone);});}

function drawMode(){
  modeRow.innerHTML="";
  if(!sel.zone){modeRow.innerHTML='<span class="empty-order" style="padding:4px">先选区</span>';return;}
  var z=DATA[sel.zone];
  MODES.forEach(function(m,i){
    if(!(m[0] in z))return;
    var has=z[m[0]]!=null;
    var c=document.createElement("div");
    c.className="chip"+(has?"":" dim")+(sel.modeIdx===i?" on":"");
    c.innerHTML=m[1]+(has?"":'<span class="p">待定</span>');
    if(has)c.onclick=function(){sel.modeIdx=i; sel.bill=null; drawMode(); drawBill(); syncBtn();};
    modeRow.appendChild(c);
  });
  if(z.note){
    var n=document.createElement("div");
    n.className="znote"; n.textContent=z.note;
    modeRow.appendChild(n);
  }
}
// 取某模式某计费的价格
function priceOf(zone,modeIdx,billKey){
  var v=DATA[zone][MODES[modeIdx][0]];
  if(typeof v==="object") return v[billKey];
  return billKey==="hour"?v:Math.round(v/2*100)/100;
}
function drawBill(){
  billRow.innerHTML="";
  if(!sel.zone||sel.modeIdx===null){billRow.innerHTML='<span class="empty-order" style="padding:4px">先选模式</span>';return;}
  BILLS.forEach(function(b){
    var pr=priceOf(sel.zone,sel.modeIdx,b[0]);
    var c=document.createElement("div");
    c.className="chip"+(sel.bill===b[0]?" on":"");
    c.innerHTML=b[1]+'<span class="p">'+pr+'</span>';
    c.onclick=function(){sel.bill=b[0]; drawBill(); syncBtn();};
    billRow.appendChild(c);
  });
}
function syncBtn(){
  var ok=sel.zone&&sel.modeIdx!==null&&sel.bill;
  document.getElementById("addBtn").disabled=!ok;
  document.getElementById("unit").textContent=ok?(BILLS.filter(function(b){return b[0]===sel.bill;})[0][2]):"";
}
function step(n){var i=document.getElementById("qty"); i.value=Math.max(1,(parseInt(i.value)||1)+n);}
function clampQty(){var i=document.getElementById("qty"); i.value=Math.max(1,parseInt(i.value)||1);}

function addItem(){
  if(!(sel.zone&&sel.modeIdx!==null&&sel.bill))return;
  var q=Math.max(1,parseInt(document.getElementById("qty").value)||1);
  var m=MODES[sel.modeIdx];
  var bill=BILLS.filter(function(b){return b[0]===sel.bill;})[0];
  var price=priceOf(sel.zone,sel.modeIdx,sel.bill);
  order.push({zone:sel.zone,mode:m[1],bill:bill[1],unit:bill[2],price:price,qty:q,sub:price*q});
  document.getElementById("qty").value=1;
  drawOrder();
}
function removeItem(i){order.splice(i,1); drawOrder();}
function clearAll(){if(order.length&&!confirm("清空当前订单？"))return; order=[]; drawOrder();}

function drawOrder(){
  var list=document.getElementById("orderList");
  if(!order.length){list.innerHTML='<div class="empty-order">还没有点单</div>';}
  else{
    list.innerHTML="";
    order.forEach(function(it,i){
      var row=document.createElement("div");
      row.className="item";
      row.innerHTML='<div class="info"><div class="name">'+it.zone+' · '+it.mode+'</div>'
        +'<div class="sub">'+it.bill+'　'+it.price+'元 × '+it.qty+it.unit+'</div></div>'
        +'<div class="money">'+round(it.sub)+'元</div>'
        +'<button class="del" onclick="removeItem('+i+')">×</button>';
      list.appendChild(row);
    });
  }
  var total=order.reduce(function(s,it){return s+it.sub;},0);
  document.getElementById("grandTotal").innerHTML=round(total)+'<small> 元</small>';
  document.getElementById("payBtn").disabled=!order.length;
}
function round(n){return Math.round(n*100)/100;}

function switchQR(w){
  document.getElementById("qrImg").src=w===1?QR_MAIN:QR_BACKUP;
  document.getElementById("tabMain").classList.toggle("on",w===1);
  document.getElementById("tabBackup").classList.toggle("on",w===2);
}
function openPay(){
  if(!order.length)return;
  var total=order.reduce(function(s,it){return s+it.sub;},0);
  document.getElementById("payNum").innerHTML=round(total)+'<small> 元</small>';
  document.getElementById("payList").innerHTML=order.map(function(it){
    return it.zone+' · '+it.mode+' · '+it.bill+' ×'+it.qty+'　'+round(it.sub)+'元';
  }).join("<br>");
  switchQR(1);
  document.getElementById("mask").classList.add("show");
  document.body.style.overflow="hidden";
}
function closePay(){
  document.getElementById("mask").classList.remove("show");
  document.body.style.overflow="";
}
function maskClick(e){if(e.target.id==="mask")closePay();}
</script>
